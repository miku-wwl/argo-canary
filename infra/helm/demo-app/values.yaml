replicaCount: 2
deploymentStrategy: canary

image:
  repository: minglai/argo-canary-demo-app
  tag: v40
  digest: ""
  pullPolicy: IfNotPresent

app:
  host: demo-app.local
  previewHost: preview.demo-app.local
  release: baseline
  faultMode: healthy
  faultDelayMs: 800

service:
  port: 80
  targetPort: 5000

istio:
  gatewaySelector:
    istio: ingressgateway

canary:
  manualApproval: false
  weights: [10, 50]
  observationSeconds: 30
  scaleDownDelaySeconds: 20

analysis:
  enabled: true
  successRate: 0.99
  p95Milliseconds: 500
  minimumRequests: 50
  window: 1m
  interval: 10s
  count: 8
  consecutiveSuccessLimit: 2
  failureLimit: 1
  inconclusiveLimit: 5

prometheus:
  analysisAddress: http://prometheus-kube-prometheus-prometheus.monitoring:9090
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus
    interval: 10s

resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: "1", memory: 128Mi}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60
