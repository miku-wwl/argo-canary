replicaCount: 2

argocd:
  host: argo-demo.mario.com

app:
  host: demo-app.mario.com

prometheus:
  host: prometheus.mario.com
  analysisAddress: http://prometheus-kube-prometheus-prometheus.monitoring:9090
  serviceMonitorNamespace: monitoring
  serviceMonitorLabels:
    release: prometheus

istio:
  gatewaySelector:
    istio: ingress

image:
  repository: minglai/argo-canary-demo-app
  tag: v38
  pullPolicy: Always

service:
  port: 80
  targetPort: 5000

canaryAnalysis:
  success: 0.99 # Success rate threshold for the analysis template

deploymentStrategy: canary # Change to "blue-green" to switch to blue-green deployment strategy

canary: 
  rollout:
    # Prometheus-backed steps automatically promote or abort based on canary success rate.
    steps:
      - setWeight: 10
      - pause: { duration: 30s }
      - analysis:
          templates:
          - templateName: istio-success-rate
          args:
          - name: service-name
            value: demo-app-canary.demo.svc.cluster.local
          - name: namespace
            value: demo
      - setWeight: 50
      - pause: {duration: 30s}
      - analysis:
          templates:
          - templateName: istio-success-rate
          args:
          - name: service-name
            value: demo-app-canary.demo.svc.cluster.local
          - name: namespace
            value: demo

    # Manual-promotion example (replace the steps above temporarily; do not add
    # a second `steps` key):
    # - setWeight: 10
    # - pause: {}
    # - setWeight: 50
    # - pause: { duration: 30s }

bluegreen:
  prePromotionAnalysis:
    templates:
    - templateName: istio-success-rate
    args:
    - name: service-name
      value: demo-app-preview.demo.svc.cluster.local
    - name: namespace
      value: demo
