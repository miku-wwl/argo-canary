{{- if .Values.analysis.enabled }}
{{- $selector := printf "reporter=\"destination\",destination_workload_namespace=\"{{args.namespace}}\",rollout_hash=\"{{args.latest-hash}}\"" -}}
{{- $volume := printf "sum(increase(istio_requests_total{%s}[%s]))" $selector .Values.analysis.window -}}
{{- $gate := printf "and on() (%s >= %v)" $volume .Values.analysis.minimumRequests -}}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "demo.name" . }}-health
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  args:
    - name: namespace
    - name: latest-hash
  metrics:
    {{- range $metric := list "minimum-volume" "success-rate" "p95-latency" }}
    - name: {{ $metric }}
      interval: {{ $.Values.analysis.interval }}
      count: {{ $.Values.analysis.count }}
      consecutiveSuccessLimit: {{ $.Values.analysis.consecutiveSuccessLimit }}
      failureLimit: {{ $.Values.analysis.failureLimit }}
      inconclusiveLimit: {{ $.Values.analysis.inconclusiveLimit }}
      consecutiveErrorLimit: 2
      {{- if eq $metric "minimum-volume" }}
      successCondition: len(result) == 1 && !isNaN(result[0]) && !isInf(result[0]) && result[0] >= {{ $.Values.analysis.minimumRequests }}
      failureCondition: "false"
      {{- else if eq $metric "success-rate" }}
      successCondition: len(result) == 1 && !isNaN(result[0]) && !isInf(result[0]) && result[0] >= {{ $.Values.analysis.successRate }}
      failureCondition: len(result) == 1 && !isNaN(result[0]) && !isInf(result[0]) && result[0] < {{ $.Values.analysis.successRate }}
      {{- else }}
      successCondition: len(result) == 1 && !isNaN(result[0]) && !isInf(result[0]) && result[0] < {{ $.Values.analysis.p95Milliseconds }}
      failureCondition: len(result) == 1 && !isNaN(result[0]) && !isInf(result[0]) && result[0] >= {{ $.Values.analysis.p95Milliseconds }}
      {{- end }}
      provider:
        prometheus:
          address: {{ $.Values.prometheus.analysisAddress | quote }}
          query: |
            {{- if eq $metric "minimum-volume" }}
            {{ $volume }}
            {{- else if eq $metric "success-rate" }}
            ((sum(rate(istio_requests_total{ {{ $selector }},response_code!~"5.*" }[{{ $.Values.analysis.window }}])) or vector(0))
            / sum(rate(istio_requests_total{ {{ $selector }} }[{{ $.Values.analysis.window }}]))) {{ $gate }}
            {{- else }}
            histogram_quantile(0.95, sum by(le)(rate(istio_request_duration_milliseconds_bucket{ {{ $selector }} }[{{ $.Values.analysis.window }}]))) {{ $gate }}
            {{- end }}
    {{- end }}
{{- end }}
