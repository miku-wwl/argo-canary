name: Build, Verify and Promote

on:
  pull_request:
  push:
    branches: [main, "feat/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - "requirements*.txt"
      - "infra/helm/demo-app/templates/**"
      - "infra/helm/demo-app/Chart.yaml"
      - "infra/helm/demo-app/values.schema.json"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      promote:
        description: Request human approval to update production desired state
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: minglai/argo-canary-demo-app

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-lock.txt PyYAML==6.0.3
      - name: Install pinned Helm and actionlint
        run: |
          curl -fsSL https://get.helm.sh/helm-v4.2.2-linux-amd64.tar.gz -o /tmp/helm.tar.gz
          curl -fsSL https://get.helm.sh/helm-v4.2.2-linux-amd64.tar.gz.sha256sum -o /tmp/helm.sha256
          (cd /tmp && sed 's/helm-v4.2.2-linux-amd64.tar.gz/helm.tar.gz/' helm.sha256 | sha256sum -c -)
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt -o /tmp/actionlint.checksums
          (cd /tmp && grep 'actionlint_1.7.12_linux_amd64.tar.gz$' actionlint.checksums | sed 's/actionlint_1.7.12_linux_amd64.tar.gz/actionlint.tar.gz/' | sha256sum -c -)
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint
      - name: Unit and chart regression tests
        run: python -m pytest -q
      - name: Helm validation
        run: |
          helm lint infra/helm/demo-app --strict
          helm template demo-app infra/helm/demo-app -n demo >/tmp/demo.yaml
          helm template demo-app infra/helm/demo-app -n demo --set deploymentStrategy=blue-green >/tmp/bluegreen.yaml
          actionlint

  build:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: minglai
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build immutable candidate
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:git-${{ github.sha }}-run-${{ github.run_id }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
      - name: Verify published digest and actual application
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "$IMAGE@$DIGEST"
          revision=$(docker image inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "$revision" = "$SOURCE_SHA"
          docker run -d --name candidate --read-only --tmpfs /tmp -e APP_RELEASE="$SOURCE_SHA" -p 127.0.0.1:5000:5000 "$IMAGE@$DIGEST"
          trap 'docker logs candidate; docker rm -f candidate >/dev/null' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:5000/readyz
          curl --fail http://127.0.0.1:5000/ | jq -e --arg sha "$SOURCE_SHA" '.release == $sha'
          jq -n --arg image "$IMAGE@$DIGEST" --arg commit "$SOURCE_SHA" --arg run "$RUN_URL" '{image:$image,commit:$commit,run:$run}' >candidate.json
          echo "Verified candidate: $IMAGE@$DIGEST" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-candidate
          path: candidate.json
          retention-days: 14

  production:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.promote)
    needs: [quality, build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    concurrency:
      group: production-gitops
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      - name: Verify approval protection and candidate freshness
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/environments/production" --jq '.protection_rules' | jq -e 'any(.type == "required_reviewers" and (.reviewers | length > 0))'
          git diff --exit-code "$SOURCE_SHA" HEAD -- src Dockerfile requirements.txt requirements-lock.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Update production desired state after approval
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.3
          python - <<'PY'
          import os, pathlib, re, yaml
          digest = os.environ["DIGEST"]
          if not re.fullmatch(r"sha256:[a-f0-9]{64}", digest):
              raise SystemExit("Invalid image digest")
          path = pathlib.Path("infra/helm/demo-app/values-production.yaml")
          values = yaml.safe_load(path.read_text())
          values["image"] = {"digest": digest}
          values["app"] = {"release": os.environ["SOURCE_SHA"][:12], "faultMode": "healthy"}
          path.write_text(yaml.safe_dump(values, sort_keys=False))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add infra/helm/demo-app/values-production.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "release: approve run $RUN_ID ($DIGEST)"
          git push origin "HEAD:$RELEASE_REF"
